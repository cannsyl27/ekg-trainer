<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Master Pro: Clinical Rhythm Trainer</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --telemetry-cyan: #06b6d4;
            --telemetry-green: #10b981;
            --telemetry-red: #ef4444;
            --telemetry-warn: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--telemetry-cyan);
            margin: 0;
            font-size: 26px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 13px;
        }

        /* Controls Block */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #151f32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .toggle-container, .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569; transition: .3s; border-radius: 22px;
        }

        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--telemetry-cyan); }
        input:checked + .slider:before { transform: translateX(22px); }

        input[type="range"] {
            accent-color: var(--telemetry-cyan);
            cursor: pointer;
        }

        /* Monitor Panel */
        .monitor-panel {
            background: #020617;
            border: 2px solid #334155;
            border-radius: 8px;
            position: relative;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .alarm-banner {
            position: absolute; top: 0; left: 0; right: 0; background: var(--telemetry-red);
            color: white; text-align: center; font-weight: bold; padding: 4px 0;
            letter-spacing: 2px; display: none; z-index: 10; animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.3; } }

        .ekg-canvas {
            display: block; width: 100%; height: 180px;
        }

        /* Metadata Metrics Overlay */
        .telemetry-metrics {
            position: absolute; top: 15px; right: 15px; text-align: right;
            font-family: monospace; font-size: 13px; color: var(--telemetry-green);
            pointer-events: none; line-height: 1.4;
        }

        /* Diagnostic Deck Options */
        .options-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px; margin-bottom: 25px;
        }

        .option-card {
            background: #1e293b; border: 1px solid var(--border-color); border-radius: 6px;
            padding: 14px; cursor: pointer; display: flex; align-items: center;
            transition: all 0.2s ease; user-select: none; position: relative;
        }

        .option-card:hover { border-color: var(--telemetry-cyan); background: #24334d; }

        .option-card input { margin-right: 12px; transform: scale(1.1); accent-color: var(--telemetry-cyan); }

        .option-card.selected { border-color: var(--telemetry-cyan); background: #163b4e; }

        /* Dynamic Feedback Modifiers */
        .option-card.correct-selected { border: 2px solid var(--telemetry-green) !important; background: #064e3b !important; }
        .option-card.correct-selected::after { content: "✓ Correct"; position: absolute; right: 8px; font-size: 11px; color: var(--telemetry-green); font-weight: bold; }

        .option-card.incorrect-selected { border: 2px solid var(--telemetry-red) !important; background: #7f1d1d !important; text-decoration: line-through; }
        .option-card.incorrect-selected::after { content: "✗ Wrong"; position: absolute; right: 8px; font-size: 11px; color: var(--telemetry-red); font-weight: bold; }

        .option-card.missed-indicator { border: 2px dashed var(--telemetry-warn) !important; background: #78350f !important; }
        .option-card.missed-indicator::after { content: "⚠ Missed"; position: absolute; right: 8px; font-size: 11px; color: var(--telemetry-warn); font-weight: bold; }

        /* Actions Footer */
        .action-bar { display: flex; justify-content: space-between; align-items: center; }

        .btn {
            padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 6px;
            border: none; cursor: pointer; transition: background 0.2s;
        }

        .btn-primary { background: var(--telemetry-cyan); color: #020617; }
        .btn-primary:hover { background: #22d3ee; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #64748b; }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        .summary-box {
            margin-top: 20px; padding: 15px; border-radius: 6px; background: #0f172a;
            border-left: 4px solid var(--telemetry-cyan); display: none;
        }

        /* Leaderboard Panel Layout */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 25px; }

        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .leaderboard-panel {
            background: #151f32; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 15px;
        }

        .leaderboard-title {
            font-size: 16px; text-transform: uppercase; color: var(--telemetry-cyan);
            border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 10px;
        }

        .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .leaderboard-table th { text-align: left; color: var(--text-muted); padding: 6px; }
        .leaderboard-table td { padding: 8px 6px; border-bottom: 1px solid #24334d; }

        /* End game input wrap */
        .save-score-wrap { display: none; background: #162e3d; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px solid var(--telemetry-cyan); }
        .save-score-wrap input { background: #020617; border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 4px; margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Telemetry Master Pro</h1>
            <p class="subtitle">Advanced Clinical Rhythm & Indicator Assessment Lab</p>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 13px; color: var(--text-muted)">Current Rotation</div>
            <div id="progress-text" style="font-size: 18px; font-weight: bold;">Rhythm 1 of 8</div>
        </div>
    </header>

    <!-- Context Config Adjustments -->
    <div class="controls-row">
        <div class="toggle-container">
            <label class="switch">
                <input type="checkbox" id="timer-toggle" onchange="toggleTimerSetting()">
                <span class="slider"></span>
            </label>
            <span>Emergency Timer</span>
        </div>
        <div class="slider-container" id="timer-slider-box" style="opacity: 0.4; pointer-events: none;">
            <span>Interval Limit:</span>
            <input type="range" id="timer-duration" min="5" max="60" value="20" oninput="updateTimerLabel()">
            <span id="timer-label"><span style="color:var(--telemetry-cyan)">20</span>s</span>
        </div>
        <div style="margin-left: auto; font-size: 14px;">
            Streak Count: <strong id="streak-counter" style="color: var(--telemetry-green)">0</strong>
        </div>
    </div>

    <!-- Main Live Screen Interface -->
    <div class="monitor-panel">
        <div class="alarm-banner" id="alarm-banner">CRITICAL ALARM: TIME EXPIRED - UNRESPONSIVE DIAGNOSTIC</div>
        <div class="telemetry-metrics">
            <div>MODE: TRAINER</div>
            <div id="hud-timer" style="color: var(--text-muted)">TIMER: OFF</div>
            <div id="hud-score" style="color: var(--telemetry-cyan)">SCORE: 0/0</div>
        </div>
        <svg id="ekg-svg" class="ekg-canvas" viewBox="0 0 1000 180" preserveAspectRatio="none">
            <defs>
                <pattern id="smallGrid" width="4" height="4" patternUnits="userSpaceOnUse">
