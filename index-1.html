<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Master: Nurse EKG Rhythm Trainer</title>
    <style>
        :root {
            --primary: #007791;
            --primary-light: #e6f4f8;
            --success: #2e7d32;
            --error: #c62828;
            --neutral-dark: #333333;
            --neutral-light: #f8f9fa;
            --ekg-bg: #fff5f5;
            --ekg-grid: #ffcccc;
            --ekg-grid-major: #ffa3a3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--neutral-light);
            color: var(--neutral-dark);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin: 0;
            font-size: 14px;
        }

        /* EKG Monitor Area */
        .ekg-screen-container {
            width: 100%;
            overflow-x: auto;
            background-color: var(--ekg-bg);
            border: 2px solid var(--ekg-grid-major);
            border-radius: 6px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }

        .ekg-canvas {
            display: block;
            min-width: 800px;
            width: 100%;
            height: 160px;
        }

        /* Interface Options */
        .quiz-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .instruction {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-card {
            background: var(--neutral-light);
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-card input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.2);
            accent-color: var(--primary);
        }

        .option-card.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
            font-weight: 600;
        }

        /* Action Buttons */
        .button-bar {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #005f75;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: var(--neutral-dark);
        }

        .btn-secondary:hover {
            background-color: #d5d5d5;
        }

        .btn:disabled {
            background-color: #cccccc;
            color: #888888;
            cursor: not-allowed;
        }

        /* Feedback Display */
        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .feedback-box.correct {
            display: block;
            background-color: #e8f5e9;
            border-left: 5px solid var(--success);
            color: var(--success);
        }

        .feedback-box.incorrect {
            display: block;
            background-color: #ffebee;
            border-left: 5px solid var(--error);
            color: var(--error);
        }

        .feedback-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .progress-bar-bg {
            background: #e0e0e0;
            height: 8px;
            width: 100%;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Telemetry Master</h1>
        <p class="subtitle">Clinical Rhythm & Indicator Diagnostic Trainer for Nurses</p>
    </header>

    <div class="progress-container">
        <div style="width: 70%;">
            <span id="progress-text">Rhythm 1 of 3</span>
            <div class="progress-bar-bg"><div id="progress-fill" class="progress-bar-fill"></div></div>
        </div>
        <div>Score: <strong id="score-text">0/0</strong></div>
    </div>

    <!-- EKG Strip Panel Overlayed with Procedural Grid via SVG -->
    <div class="ekg-screen-container">
        <svg id="ekg-svg" class="ekg-canvas" viewBox="0 0 1000 160" preserveAspectRatio="none">
            <defs>
                <!-- 1mm Small Box (Grid Step 4) -->
                <pattern id="smallGrid" width="4" height="4" patternUnits="userSpaceOnUse">
                    <path d="M 4 0 L 0 0 0 4" fill="none" stroke="var(--ekg-grid)" stroke-width="0.5"/>
                </pattern>
                <!-- 5mm Large Box (Grid Step 20) -->
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect width="20" height="20" fill="url(#smallGrid)"/>
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--ekg-grid-major)" stroke-width="1"/>
                </pattern>
            </defs>
            <!-- Background grid layout -->
            <rect width="100%" height="100%" fill="url(#grid)" />
            <!-- EKG Signal path will be rendered here dynamically -->
            <path id="ekg-signal" d="" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <div class="quiz-section">
        <div>
            <div class="instruction">Analyze the telemetry strip. Select all rhythm types and indicators that apply:</div>
            <div id="options-container" class="options-grid">
                <!-- Javascript will build checkboxes here -->
            </div>
        </div>

        <div class="button-bar">
            <button id="btn-submit" class="btn btn-primary" onclick="checkAnswers()">Submit Diagnostic</button>
            <button id="btn-next" class="btn btn-secondary" onclick="nextQuestion()" disabled>Next Strip &raquo;</button>
        </div>

        <div id="feedback" class="feedback-box">
            <div id="feedback-status" class="feedback-title"></div>
            <p id="feedback-explanation"></p>
        </div>
    </div>
</div>

<script>
    // Database of EKG Rhythms with SVG paths & multiple selection conditions
    const ekgDataset = [
        {
            name: "Normal Sinus Rhythm",
            path: "M 0,90 Q 15,85 25,90 L 65,90 L 70,100 L 75,30 L 82,110 L 86,90 L 105,90 Q 120,75 135,90 L 165,90 Q 180,85 190,90 L 230,90 L 235,100 L 240,30 L 247,110 L 251,90 L 270,90 Q 285,75 300,90 L 330,90 Q 345,85 355,90 L 395,90 L 400,100 L 405,30 L 412,110 L 416,90 L 435,90 Q 450,75 465,90 L 495,90 Q 510,85 520,90 L 560,90 L 565,100 L 570,30 L 577,110 L 581,90 L 600,90 Q 615,75 630,90 L 660,90 Q 675,85 685,90 L 725,90 L 730,100 L 735,30 L 742,110 L 746,90 L 765,90 Q 780,75 795,90 L 825,90 Q 840,85 850,90 L 890,90 L 895,100 L 900,30 L 907,110 L 911,90 L 930,90 Q 945,75 960,90 L 1000,90",
            correctIndicators: ["Normal Sinus Rhythm", "Regular Rhythm", "Normal PR Interval"],
            explanation: "This strip shows normal clinical markers: a regular rhythm cycling roughly at 75 BPM, clearly structured upright P-waves preceding every QRS complex, and standard intervals throughout."
        },
        {
            name: "Sinus Bradycardia with ST Elevation",
            path: "M 0,90 Q 20,85 35,90 L 120,90 L 125,100 L 130,25 L 138,110 L 142,75 L 175,75 Q 195,65 210,90 L 420,90 Q 440,85 455,90 L 540,90 L 545,100 L 550,25 L 558,110 L 562,75 L 595,75 Q 615,65 630,90 L 840,90 Q 860,85 875,90 L 960,90 L 965,100 L 970,25 L 978,110 L 982,75 L 1000,75",
            correctIndicators: ["Sinus Bradycardia", "ST-Segment Elevation (Potential MI)", "Regular Rhythm"],
            explanation: "Note two key dangerous features: the heart rate is noticeably slow (< 60 BPM defining Bradycardia), and the ST segment drops off late, failing to return fully down to the isometric baseline. This indicates acute myocardial injury (STEMI)."
        },
        {
            name: "Atrial Fibrillation",
            path: "M 0,90 Q 5,87 10,92 T 20,88 T 30,92 L 33,102 L 37,20 L 42,112 L 46,90 T 55,92 T 65,88 T 75,93 T 85,87 T 95,92 L 98,102 L 102,20 L 107,112 L 111,90 T 125,92 T 140,87 T 155,93 T 170,88 T 185,92 L 188,102 L 192,20 L 197,112 L 201,90 T 215,92 T 225,87 T 235,93 T 245,88 T 255,91 T 265,87 L 268,102 L 272,20 L 277,112 L 281,90 T 300,92 T 320,87 T 340,93 T 360,88 T 380,92 L 383,102 L 387,20 L 392,112 L 396,90 T 410,92 T 420,87 T 430,93 T 445,88 L 448,102 L 452,20 L 457,112 L 461,90 T 480,92 T 500,87 T 520,93 T 540,88 T 560,92 L 563,102 L 567,20 L 572,112 L 576,90 T 590,92 T 605,87 T 620,93 T 635,88 T 650,92 L 653,102 L 657,20 L 662,112 L 666,90 T 685,92 T 705,87 T 725,93 T 745,88 T 765,92 L 768,102 L 772,20 L 777,112 L 781,90 T 800,92 T 815,87 T 830,93 T 845,88 T 860,92 L 863,102 L 867,20 L 872,112 L 876,90 T 895,92 T 915,87 T 935,93 T 955,88 T 975,92 L 978,102 L 982,20 L 987,112 L 991,90",
            correctIndicators: ["Atrial Fibrillation", "Irregularly Irregular Rhythm", "Absent P-Waves"],
            explanation: "This strip perfectly satisfies the classic parameters of A-Fib: the R-R intervals have no pattern at all (Irregularly Irregular), and normal uniform P-waves are absent, replaced instead by fibrillatory chaotic baseline oscillations."
        }
    ];

    const allPossibleIndicators = [
        "Normal Sinus Rhythm",
        "Sinus Bradycardia",
        "Atrial Fibrillation",
        "Regular Rhythm",
        "Irregularly Irregular Rhythm",
        "Absent P-Waves",
        "Normal PR Interval",
        "ST-Segment Elevation (Potential MI)"
    ];

    let currentQuestionIndex = 0;
    let totalQuestionsAttempted = 0;
    let pointsScored = 0;

    function loadQuestion() {
        const currentData = ekgDataset[currentQuestionIndex];
        document.getElementById("progress-text").innerText = `Rhythm ${currentQuestionIndex + 1} of ${ekgDataset.length}`;
        const pct = ((currentQuestionIndex) / ekgDataset.length) * 100;
        document.getElementById("progress-fill").style.width = `${pct}%`;

        document.getElementById("ekg-signal").setAttribute("d", currentData.path);

        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        allPossibleIndicators.forEach((indicator, index) => {
            const card = document.createElement("div");
            card.className = "option-card";
            card.id = `card-${index}`;
            card.onclick = () => toggleCardSelection(index);

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.id = `check-${index}`;
            checkbox.value = indicator;
            checkbox.onclick = (e) => e.stopPropagation();
            checkbox.onchange = () => synchronizeCardStyle(index);

            const label = document.createElement("label");
            label.setAttribute("for", `check-${index}`);
            label.innerText = indicator;
            label.style.cursor = "pointer";
            label.onclick = (e) => e.stopPropagation();

            card.appendChild(checkbox);
            card.appendChild(label);
            container.appendChild(card);
        });

        const feedback = document.getElementById("feedback");
        feedback.className = "feedback-box";
        feedback.style.display = "none";
        
        document.getElementById("btn-submit").disabled = false;
        document.getElementById("btn-next").disabled = true;
    }

    function toggleCardSelection(index) {
        if(document.getElementById("btn-submit").disabled) return;
        const box = document.getElementById(`check-${index}`);
        box.checked = !box.checked;
        synchronizeCardStyle(index);
    }

    function synchronizeCardStyle(index) {
        const box = document.getElementById(`check-${index}`);
        const card = document.getElementById(`card-${index}`);
        if(box.checked) {
            card.classList.add("selected");
        } else {
            card.classList.remove("selected");
        }
    }

    function checkAnswers() {
        const currentData = ekgDataset[currentQuestionIndex];
        let userSelected = [];
        
        allPossibleIndicators.forEach((ind, index) => {
            if(document.getElementById(`check-${index}`).checked) {
                userSelected.push(ind);
            }
        });

        const matchesAll = currentData.correctIndicators.length === userSelected.length && 
                           currentData.correctIndicators.every(val => userSelected.includes(val));

        const feedbackBox = document.getElementById("feedback");
        const statusText = document.getElementById("feedback-status");
        const explText = document.getElementById("feedback-explanation");

        document.getElementById("btn-submit").disabled = true;
        document.getElementById("btn-next").disabled = false;
        allPossibleIndicators.forEach((_, idx) => {
            document.getElementById(`check-${idx}`).disabled = true;
        });

        totalQuestionsAttempted++;
        if(matchesAll) {
            pointsScored++;
            feedbackBox.className = "feedback-box correct";
            statusText.innerText = "✓ Diagnostic Correct!";
        } else {
            feedbackBox.className = "feedback-box incorrect";
            statusText.innerText = "✗ Diagnostic Discrepancies Found";
        }

        let targetListText = currentData.correctIndicators.join(", ");
        explText.innerHTML = `<strong>Expected Features:</strong> [${targetListText}]<br><br>${currentData.explanation}`;
        
        document.getElementById("score-text").innerText = `${pointsScored}/${totalQuestionsAttempted}`;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if(currentQuestionIndex >= ekgDataset.length) {
            currentQuestionIndex = 0;
        }
        loadQuestion();
    }

    window.onload = loadQuestion;
</script>
</body>
</html>
